<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Avaliativo 2</title>
    <link rel="stylesheet" href="../style/exercicioA2.css">
</head>

<body>


    <main>
        <h2> ⇨ Cadastre e concorra! </h2>
        <p>Preencha o formulário e concorra a uma viagem dos sonhos para você e mais um acompahante para <br> o local de sua escolha!</p>
    
        <section>
            <form action="">

                <p>Nome:</p>
                <input type="text" placeholder="Digite seu nome">

                <br><br>

                <p>E-mail:</p>
                <input type="E-mail" placeholder="Digite seu E-mail">

                <br><br>

                <p>Data de nascimento:</p>
                <input type="datetime-local">

                <br><br>

                <p>CPF:</p>
                <input type="number" placeholder="Digite seu CPF">

                <br><br>

                <p>CEP:</p>
                <input type="number" placeholder="Digite seu CEP">

                <!-- COLOCAR AO LADO -->

                <p>Estado:</p>
                <input type="text" placeholder="Digite seu estado">
               
                <br><br>
                
                <p>Cidade:</p>
                <input type="text" placeholder="Digite sua cidade">

                <!-- COLOCAR AO LADO -->

                <p>Bairro:</p>
                <input type="text" placeholder="Digite seu bairro">

                <br><br>

                <p>Rua:</p>
                <input type="text and number" placeholder="Digite sua rua">

                <!--COLOCAR AO LADO -->

                <p>Complemento:</p>
                <input type="text and number" placeholder="Digite o complemento (ex: Apto 102)">
 
                <br><br><br>

                <button type="submit">CADASTRAR</button>


        </section>
    
    
    
    
    
    </main>

























</body>
